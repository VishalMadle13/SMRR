version: '3.8'

services:
  db:
    image: mysql:latest
    container_name: my-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Pass@12345
      MYSQL_DATABASE: srrhs
      MYSQL_USER: myuser
      MYSQL_PASSWORD: Pass@123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initDump.sql:/docker-entrypoint-initdb.d/initDump.sql
    networks:
      - mynetwork
    
  web:
    build: .
    container_name: my-django-app
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "smrr.wsgi:application"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - mynetwork

volumes:
  mysql_data:

networks:
  mynetwork:
